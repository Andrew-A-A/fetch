# Builds the Windows installer, macOS .dmg (Intel + Apple silicon) and Linux AppImage; each runner builds its own OS.
# Builds are attached to the run as artifacts; pushing a v* tag also puts them on a draft GitHub release.
name: build
on:
  push: { tags: ['v*'] }
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, macos-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' } # no signing certificate yet
      - uses: actions/upload-artifact@v4
        with:
          name: fetch-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
